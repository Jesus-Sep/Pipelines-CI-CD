name: Django API Code Quality Assurance

on:
  push:
    branches: [ main, develop ]

  pull_request:
    branches: [ main, develop ]

jobs:
  linter-check:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo del repositorio
        uses: actions/checkout@v3

      - name: Configurar Entorno Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Instalar Dependencias de Calidad
        run: |
          python -m pip install --upgrade pip
          pip install flake8 isort

      - name: Ejecutar Verificación de Importaciones (isort)
        run: isort --check-only --profile black .

      - name: Ejecutar Analizador Estático (flake8)
        run: flake8 .
